services:
  postgresdb:
    image: postgres
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 3s
      retries: 10

  adminerdb:
    image: adminer
    ports:
      - 8080:8080
    environment:
      - ADMINER_DEFAULT_SERVER=postgresdb

  app:
    build: .
    ports:
      - 3000:3000
    env_file:
      - .env
    depends_on:
      postgresdb:
        condition: service_healthy